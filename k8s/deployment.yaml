apiVersion: apps/v1
kind: Deployment
metadata:
  name: policegpt-backend
  namespace: policegpt
  labels:
    app: policegpt-backend
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: policegpt-backend
  template:
    metadata:
      labels:
        app: policegpt-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: ghcr.io/ksp-ai/policegpt-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: policegpt-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: policegpt-secrets
                  key: redis-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: policegpt-secrets
                  key: secret-key
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: policegpt-backend-svc
  namespace: policegpt
spec:
  selector:
    app: policegpt-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policegpt-frontend
  namespace: policegpt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policegpt-frontend
  template:
    metadata:
      labels:
        app: policegpt-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ksp-ai/policegpt-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://policegpt-api.karnataka.gov.in"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: policegpt-frontend-svc
  namespace: policegpt
spec:
  selector:
    app: policegpt-frontend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: policegpt-ingress
  namespace: policegpt
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - policegpt.karnataka.gov.in
      secretName: policegpt-tls
  rules:
    - host: policegpt.karnataka.gov.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: policegpt-backend-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: policegpt-frontend-svc
                port:
                  number: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policegpt-backend-hpa
  namespace: policegpt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: policegpt-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
